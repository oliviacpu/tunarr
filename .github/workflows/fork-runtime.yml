name: Fork runtime validation

on:
  pull_request:
    paths:
      - 'Dockerfile'
      - '.github/workflows/fork-runtime.yml'
      - 'server/scripts/worker-smoke-test.ts'
      - 'server/**/*.local.test.ts'
  workflow_dispatch:
  schedule:
    - cron: '17 9 * * *'

permissions:
  contents: read

concurrency:
  group: fork-runtime
  cancel-in-progress: false

jobs:
  runtime:
    if: github.repository == 'oliviacpu/tunarr'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - name: Validate the packaged runtime
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          target: runtime-tests
          push: false
          build-args: |
            is_edge_build=false
            tunarr_version=runtime-validation
            tunarr_build=${{ github.sha }}
            exec_target=linux-x64
          cache-from: type=gha,scope=fork-runtime
          cache-to: type=gha,mode=max,scope=fork-runtime
